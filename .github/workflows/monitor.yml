
name: Check Zaymyshche Electricity Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check DTEK address
        run: python main.py
