
name: DTEK Electricity Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: dtek-electricity-monitor
  cancel-in-progress: false

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Check DTEK and send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u main.py

      - name: Save previous schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update DTEK schedule state"

            for attempt in 1 2 3; do
              if git push; then
                echo "Schedule state successfully saved."
                exit 0
              fi

              echo "Push attempt $attempt failed."

              if [ "$attempt" -lt 3 ]; then
                sleep 10
              fi
            done

            echo "Could not save schedule state after 3 attempts."
            exit 1
          else
            echo "Schedule state has not changed."
          fi
